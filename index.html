<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora iOS 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
}

.calculator{
    width:380px;
    max-width:95vw;
    padding:20px;
    border-radius:40px;
    background:#000;
}

.display{
    color:white;
    text-align:right;
    padding:30px 10px;
    font-size:4rem;
    font-weight:300;
    overflow:hidden;
    white-space:nowrap;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    border:none;
    border-radius:50%;
    height:78px;
    width:78px;
    font-size:2rem;
    cursor:pointer;
    transition:.15s;
}

button:active{
    transform:scale(.95);
}

.gray{
    background:#a5a5a5;
    color:#000;
}

.dark{
    background:#333333;
    color:#fff;
}

.orange{
    background:#ff9f0a;
    color:#fff;
}

.zero{
    grid-column:span 2;
    width:100%;
    border-radius:50px;
    text-align:left;
    padding-left:30px;
}

@media(max-width:420px){
    button{
        width:100%;
        height:70px;
    }

    .display{
        font-size:3rem;
    }
}
</style>
</head>
<body>

<div class="calculator">

    <div class="display" id="display">0</div>

    <div class="buttons">

        <button class="gray" onclick="clearDisplay()">AC</button>
        <button class="gray" onclick="toggleSign()">±</button>
        <button class="gray" onclick="percent()">%</button>
        <button class="orange" onclick="append('/')">÷</button>

        <button class="dark" onclick="append('7')">7</button>
        <button class="dark" onclick="append('8')">8</button>
        <button class="dark" onclick="append('9')">9</button>
        <button class="orange" onclick="append('*')">×</button>

        <button class="dark" onclick="append('4')">4</button>
        <button class="dark" onclick="append('5')">5</button>
        <button class="dark" onclick="append('6')">6</button>
        <button class="orange" onclick="append('-')">−</button>

        <button class="dark" onclick="append('1')">1</button>
        <button class="dark" onclick="append('2')">2</button>
        <button class="dark" onclick="append('3')">3</button>
        <button class="orange" onclick="append('+')">+</button>

        <button class="dark zero" onclick="append('0')">0</button>
        <button class="dark" onclick="append('.')">.</button>
        <button class="orange" onclick="calculate()">=</button>

    </div>

</div>

<script>
let current = '';

const display = document.getElementById('display');

function updateDisplay(){
    display.textContent = current || '0';
}

function append(value){
    current += value;
    updateDisplay();
}

function clearDisplay(){
    current = '';
    updateDisplay();
}

function toggleSign(){
    if(!current) return;

    if(current.startsWith('-')){
        current = current.substring(1);
    }else{
        current = '-' + current;
    }

    updateDisplay();
}

function percent(){
    if(!current) return;

    try{
        current = String(eval(current) / 100);
        updateDisplay();
    }catch{
        display.textContent = 'Erro';
    }
}

function calculate(){
    try{
        current = String(eval(current));
        updateDisplay();
    }catch{
        display.textContent = 'Erro';
        current = '';
    }
}

document.addEventListener('keydown',(e)=>{
    const allowed = '0123456789+-*/.';
    
    if(allowed.includes(e.key)){
        append(e.key);
    }

    if(e.key === 'Enter'){
        calculate();
    }

    if(e.key === 'Backspace'){
        current = current.slice(0,-1);
        updateDisplay();
    }

    if(e.key === 'Escape'){
        clearDisplay();
    }
});
</script>

</body>
</html>
